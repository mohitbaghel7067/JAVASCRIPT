<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-top: 20px;
            color: #333;
        }

        .game {
            width: 320px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 10px;
        }

        .game button {
            width: 100px;
            height: 100px;
            font-size: 40px;
            border: none;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 0 5px gray;
            cursor: pointer;
        }

        .game button:hover {
            background-color: #e6e6e6;
        }

        #reset {
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: black;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Tic Tac Toe</h1>

    <div class="game">
        <button></button>
        <button></button>
        <button></button>
        <button></button>
        <button></button>
        <button></button>
        <button></button>
        <button></button>
        <button></button>
    </div>
    <h2 id="msg"></h2>

    <button id="reset">Reset Game</button>

    <script src="tiktak.js"></script>

</body>
</html>
