<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sum</title>
</head>
<body>
    <script>
        let arr=[1,2,3,5,4,6];
        let sum=0;
        for(let i=0;i<arr.length;i++){
            sum=sum+arr[i];
        }
        console.log(' sum of the array is ='+sum);
        let square=[];
        for(let i=0;i<arr.length;i++){
            square.push(arr[i]*arr[i]);
        }
        console.log(square);
    </script>
</body>
</html>
